name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        run: node -e "if(process.env.RELEASE_TAG!=='v'+require('./package.json').version)throw Error('Tag must match package.json version')"

      - name: Run model and server tests
        run: npm test

      - name: Run browser tests
        run: npm run test:ui

      - name: Build Windows packages
        run: npm run package:win

      - name: Verify packaged application
        run: node tests/smoke-exe.cjs

      - name: Prepare release assets
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw "Could not read package version" }
          $asset = Get-Item -LiteralPath "release/RaceCast-Graphics-$version-portable.exe" -ErrorAction Stop
          $hash = (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $checksumPath = "$($asset.FullName).sha256"
          Set-Content -LiteralPath $checksumPath -Value "$hash  $($asset.Name)" -Encoding ascii -NoNewline
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "ASSET_PATH=$($asset.FullName)$([Environment]::NewLine)", $utf8)
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "CHECKSUM_PATH=$checksumPath$([Environment]::NewLine)", $utf8)

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          $assets = @($env:ASSET_PATH, $env:CHECKSUM_PATH)
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload release assets" }
          } else {
            gh release create $env:RELEASE_TAG $assets --repo $env:GITHUB_REPOSITORY --title "RaceCast Graphics $env:RELEASE_TAG" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Failed to create GitHub Release" }
          }
